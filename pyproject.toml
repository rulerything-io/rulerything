[project]
name = "rulerything"
version = "1.1.0"
description = "自进化规则知识库系统 — 作为大语言模型确定性副脑的知识规则系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
full = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "jieba>=0.42",
    "rank-bm25>=0.2",
]
semantic = [
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rulerything*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
