<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则系统管理面板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", monospace; background: #f5f6fa; color: #2d3436; display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 200px; background: #2d3436; color: #dfe6e9; padding: 20px 0; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar h1 { font-size: 16px; padding: 0 16px 16px; border-bottom: 1px solid #636e72; margin-bottom: 8px; color: #fff; }
.sidebar .ver { font-size: 11px; color: #b2bec3; font-weight: normal; }
.nav-item { padding: 10px 16px; cursor: pointer; font-size: 14px; transition: background .15s; border-left: 3px solid transparent; }
.nav-item:hover { background: #636e72; }
.nav-item.active { background: #636e72; border-left-color: #55efc4; color: #55efc4; }
.nav-item .icon { margin-right: 8px; }

/* Main */
.main { flex: 1; padding: 24px 32px; overflow-y: auto; max-height: 100vh; }
.page { display: none; }
.page.active { display: block; }
.page-title { font-size: 22px; margin-bottom: 20px; color: #2d3436; font-weight: 600; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.auto-badge { font-size: 12px; font-weight: normal; color: #00b894; display: inline-flex; align-items: center; gap: 4px; }
.auto-badge.paused { color: #b2bec3; }
.auto-toggle { font-size: 12px; font-weight: normal; color: #636e72; cursor: pointer; margin-left: auto; display: flex; align-items: center; gap: 4px; }
.auto-toggle:hover { color: #2d3436; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.card .label { font-size: 12px; color: #636e72; margin-bottom: 4px; }
.card .value { font-size: 26px; font-weight: 700; color: #2d3436; }
.card .sub { font-size: 12px; color: #b2bec3; margin-top: 2px; }
.card.green .value { color: #00b894; }
.card.blue .value { color: #0984e3; }
.card.orange .value { color: #e17055; }
.card.purple .value { color: #6c5ce7; }

/* Stats row */
.stat-row { display: flex; gap: 32px; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 24px; }
.stat-group h3 { font-size: 13px; color: #636e72; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.stat-group .item { font-size: 13px; padding: 3px 0; }
.stat-group .item .k { color: #636e72; display: inline-block; width: 100px; }
.stat-group .item .v { color: #2d3436; font-weight: 600; }

/* Category breakdown */
.cat-bar { margin: 6px 0; }
.cat-bar .row { display: flex; align-items: center; margin: 5px 0; }
.cat-bar .row .name { width: 100px; font-size: 13px; color: #2d3436; }
.cat-bar .row .bar-wrap { flex: 1; height: 20px; background: #dfe6e9; border-radius: 4px; overflow: hidden; position: relative; }
.cat-bar .row .bar-fill { height: 100%; border-radius: 4px; transition: width .5s; }
.cat-bar .row .bar-label { position: absolute; right: 6px; top: 2px; font-size: 11px; color: #636e72; }

/* Table */
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #f1f2f6; }
th { background: #f8f9fa; color: #636e72; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
tr:hover td { background: #f8f9fa; }
tr:last-child td { border-bottom: none; }

/* Confidence bar inline */
.cbar { display: inline-block; width: 80px; height: 14px; background: #dfe6e9; border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.cbar-fill { height: 100%; border-radius: 3px; background: #00b894; transition: width .3s; }

/* Buttons */
.btn { display: inline-block; padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; transition: all .15s; }
.btn-primary { background: #0984e3; color: #fff; }
.btn-primary:hover { background: #0770c4; }
.btn-success { background: #00b894; color: #fff; }
.btn-success:hover { background: #00a381; }
.btn-danger { background: #d63031; color: #fff; }
.btn-danger:hover { background: #b71c1c; }
.btn-warning { background: #fdcb6e; color: #2d3436; }
.btn-warning:hover { background: #f0b94a; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-outline { background: transparent; border: 1px solid #dfe6e9; color: #636e72; }
.btn-outline:hover { border-color: #0984e3; color: #0984e3; }

/* Search */
.search-box { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.search-box input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 14px; font-family: inherit; }
.search-box input:focus { outline: none; border-color: #0984e3; }
.search-box select { padding: 8px 12px; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }

/* Results */
.result-card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.result-card h3 { font-size: 15px; margin-bottom: 6px; }
.result-card .meta { font-size: 12px; color: #636e72; margin-bottom: 8px; }
.result-card .meta span { margin-right: 16px; }
.result-card .content { font-size: 13px; line-height: 1.6; color: #2d3436; white-space: pre-wrap; background: #f8f9fa; padding: 12px; border-radius: 6px; margin-top: 8px; display: none; }
.result-card .content.show { display: block; }

/* Evolution list */
.evo-item { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; justify-content: space-between; align-items: center; }
.evo-item .info { flex: 1; }
.evo-item .info strong { font-size: 14px; }
.evo-item .info .desc { font-size: 12px; color: #636e72; margin-top: 2px; }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; background: #dfe6e9; border-radius: 4px; font-size: 11px; color: #636e72; margin: 2px; }

/* Toast */
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 999; opacity: 0; transform: translateY(-10px); transition: all .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #00b894; }
.toast.error { background: #d63031; }
.toast.info { background: #0984e3; }

/* Empty state */
.empty { text-align: center; color: #b2bec3; padding: 40px 0; font-size: 14px; }

/* Section tabs */
.section-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.section-tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; background: #dfe6e9; color: #636e72; border: none; font-family: inherit; }
.section-tab.active { background: #0984e3; color: #fff; }

/* Feedback buttons */
.fb { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid #dfe6e9; background: #fff; color: #636e72; margin: 2px; }
.fb:hover { border-color: #636e72; }
.fb.done { background: #55efc4; border-color: #00b894; color: #00b894; }

/* Log viewer */
.log-container { background: #1e272e; border-radius: 8px; padding: 8px 0; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 12px; max-height: 70vh; overflow-y: auto; }
.log-entry { padding: 4px 12px; border-bottom: 1px solid #2d3436; line-height: 1.5; display: flex; gap: 8px; }
.log-entry:hover { background: #2d3436; }
.log-time { color: #636e72; white-space: nowrap; flex-shrink: 0; width: 80px; }
.log-level { width: 50px; flex-shrink: 0; font-weight: 600; }
.log-level.INFO { color: #55efc4; }
.log-level.WARN { color: #fdcb6e; }
.log-level.ERROR { color: #d63031; background: rgba(214,48,49,.15); border-radius: 2px; padding: 0 4px; }
.log-type { color: #74b9ff; width: 70px; flex-shrink: 0; }
.log-msg { color: #dfe6e9; flex: 1; word-break: break-all; }
.log-extra { color: #b2bec3; font-size: 11px; margin-left: 4px; }
.log-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.log-toolbar select { padding: 4px 10px; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 13px; background: #fff; }
.log-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: top; }
.log-badge.live { background: #55efc4; color: #00b894; }

/* Responsive */
@media (max-width: 700px) {
  .sidebar { width: 50px; }
  .sidebar h1 span, .sidebar .ver, .nav-item span { display: none; }
  .sidebar h1 { font-size: 14px; padding: 8px; }
  .nav-item { padding: 10px; text-align: center; }
  .main { padding: 16px; }
  .cards { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="sidebar">
  <h1><span>&#9670; 规则系统</span> <span class="ver" id="sidebar-ver">v2.0</span></h1>
  <div class="nav-item active" data-page="overview"><span class="icon">&#9632;</span><span>概览</span></div>
  <div class="nav-item" data-page="rules"><span class="icon">&#9776;</span><span>规则列表</span></div>
  <div class="nav-item" data-page="search-page"><span class="icon">&#9906;</span><span>搜索</span></div>
  <div class="nav-item" data-page="evolution"><span class="icon">&#9851;</span><span>进化管理</span></div>
  <div class="nav-item" data-page="logs"><span class="icon">&#9773;</span><span>日志 <span class="log-badge live">LIVE</span></span></div>
  <div style="flex:1"></div>
  <div style="padding:8px 16px;border-top:1px solid #636e72;margin-top:4px">
    <button class="btn btn-danger btn-sm" style="width:100%" onclick="restartServer()">&#8635; 重启服务</button>
  </div>
</div>

<div class="main">

<!-- ===== 概览 ===== -->
<div id="page-overview" class="page active">
  <div class="page-title">
    概览
    <span class="auto-badge" id="ov-badge">● 自动刷新 10s</span>
    <span class="auto-toggle" onclick="toggleAutoRefresh()" id="auto-toggle-btn">&#9635; 恢复</span>
  </div>
  <div class="cards" id="overview-cards"></div>

  <div class="stat-row">
    <div class="stat-group" id="sys-stats">
      <h3>系统</h3>
      <div class="item"><span class="k">运行时间</span><span class="v" id="uptime">-</span></div>
      <div class="item"><span class="k">索引版本</span><span class="v" id="idxver">-</span></div>
      <div class="item"><span class="k">搜索总量</span><span class="v" id="total-srch">-</span></div>
      <div class="item"><span class="k">缓存命中率</span><span class="v" id="cache-rate">-</span></div>
    </div>
    <div class="stat-group" id="evo-stats">
      <h3>进化</h3>
      <div class="item"><span class="k">待处理</span><span class="v" id="evo-pending">-</span></div>
      <div class="item"><span class="k">反馈总数</span><span class="v" id="evo-fb">-</span></div>
      <div class="item"><span class="k">归档版本</span><span class="v" id="evo-arch">-</span></div>
    </div>
    <div class="stat-group" id="cat-stats">
      <h3>分类分布</h3>
      <div class="cat-bar" id="cat-bars"></div>
    </div>
  </div>
</div>

<!-- ===== 规则列表 ===== -->
<div id="page-rules" class="page">
  <div class="page-title">
    规则列表
    <span class="auto-badge" id="rules-badge">● 自动刷新 30s</span>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <select id="rule-cat-filter" style="padding:6px 12px;border:1px solid #dfe6e9;border-radius:6px;font-size:13px">
      <option value="all">全部分类</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="loadRules()">刷新</button>
    <button class="btn btn-success btn-sm" onclick="showAddRule()">+ 添加规则</button>
  </div>
  <table><thead><tr><th>ID</th><th>标题</th><th>分类</th><th>置信度</th><th>标签</th><th>命中</th><th></th></tr></thead>
    <tbody id="rule-table"></tbody>
  </table>
  <div class="empty" id="rule-empty" style="display:none">暂无规则</div>
</div>

<!-- ===== 搜索 ===== -->
<div id="page-search-page" class="page">
  <div class="page-title">搜索</div>
  <div class="search-box">
    <input type="text" id="sq" placeholder="输入搜索关键词…" onkeydown="if(event.key==='Enter')doSearch()">
    <select id="stype">
      <option value="prefix">前缀</option>
      <option value="exact">精确</option>
      <option value="tag">标签</option>
    </select>
    <select id="scat">
      <option value="all">全部分类</option>
    </select>
    <button class="btn btn-primary" onclick="doSearch()">搜索</button>
  </div>
  <div id="search-results"></div>
</div>

<!-- ===== 进化管理 ===== -->
<div id="page-evolution" class="page">
  <div class="page-title">
    进化管理
    <span class="auto-badge" id="evo-badge">● 自动刷新 15s</span>
  </div>

  <div class="section-tabs">
    <button class="section-tab active" data-tab="evo-pending-tab">待处理</button>
    <button class="section-tab" data-tab="evo-rollback-tab">回滚</button>
    <button class="section-tab" data-tab="evo-logs-tab">日志</button>
  </div>

  <!-- Pending -->
  <div id="evo-pending-tab" class="evo-tab">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-warning btn-sm" onclick="evoDryRun()">预览 (dry-run)</button>
      <button class="btn btn-success btn-sm" onclick="evoApply()">执行进化</button>
      <button class="btn btn-outline btn-sm" onclick="loadPending()">刷新</button>
    </div>
    <div id="evo-pending-list"><div class="empty">加载中…</div></div>
  </div>

  <!-- Rollback -->
  <div id="evo-rollback-tab" class="evo-tab" style="display:none">
    <div class="search-box">
      <input type="text" id="rb-rule-id" placeholder="规则 ID，如 performance/001" style="max-width:300px">
      <button class="btn btn-outline btn-sm" onclick="loadVersions()">查看版本</button>
    </div>
    <div id="rb-versions" style="margin-bottom:12px"></div>
    <div class="search-box" id="rb-form" style="display:none">
      <input type="number" id="rb-version" placeholder="目标版本号" min="1" style="max-width:150px">
      <button class="btn btn-danger btn-sm" onclick="doRollback()">回滚到该版本</button>
    </div>
    <div id="rb-result"></div>
  </div>

  <!-- Logs -->
  <div id="evo-logs-tab" class="evo-tab" style="display:none">
    <div class="cards" id="evo-stats-cards"></div>
  </div>
</div>

<!-- ===== 日志 ===== -->
<div id="page-logs" class="page">
  <div class="page-title">
    &#9773; 实时日志
    <span id="log-live-indicator" style="font-size:13px;font-weight:normal;color:#00b894;margin-left:12px">● 自动刷新</span>
  </div>
  <div class="log-toolbar">
    <select id="log-level-filter" onchange="restartLogPolling()">
      <option value="">全部级别</option>
      <option value="INFO">INFO</option>
      <option value="WARN">WARN</option>
      <option value="ERROR">ERROR</option>
    </select>
    <select id="log-type-filter" onchange="restartLogPolling()">
      <option value="">全部类型</option>
      <option value="query">query</option>
      <option value="evolution">evolution</option>
      <option value="system">system</option>
    </select>
    <span style="font-size:12px;color:#636e72">每 3 秒刷新</span>
    <button class="btn btn-outline btn-sm" onclick="restartLogPolling();loadLogs()">立即刷新</button>
    <label style="font-size:12px;color:#636e72;margin-left:8px">
      <input type="checkbox" id="log-auto-scroll" checked> 自动滚动
    </label>
  </div>
  <div class="log-container" id="log-list">
    <div class="empty" style="color:#636e72">加载中…</div>
  </div>
</div>

</div><!-- .main -->

<div class="toast" id="toast"></div>

<!-- ===== Add Rule Modal (simple inline) ===== -->
<div id="add-rule-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100" onclick="hideAddRule(event)">
<div style="background:#fff;max-width:500px;margin:80px auto;padding:24px;border-radius:12px;position:relative" onclick="event.stopPropagation()">
<h3 style="margin-bottom:12px">添加规则</h3>
<textarea id="rule-json" rows="8" style="width:100%;padding:8px;border:1px solid #dfe6e9;border-radius:6px;font-family:monospace;font-size:13px" placeholder='{"id":"mycat/001","title":"我的规则","content":"规则内容","category":"mycat","tags":["tag1"]}'></textarea>
<div style="margin-top:10px;display:flex;gap:8px">
  <button class="btn btn-success" onclick="addRule()">添加</button>
  <button class="btn btn-outline" onclick="hideAddRule()">取消</button>
</div>
<div id="add-rule-result" style="margin-top:8px;font-size:13px"></div>
</div>
</div>

<script>
// ── Navigation ──
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('page-' + el.dataset.page).classList.add('active');
  });
});

// Section tabs
document.querySelectorAll('.section-tab').forEach(el => {
  el.addEventListener('click', () => {
    const parent = el.closest('.page') || document;
    parent.querySelectorAll('.section-tab').forEach(x => x.classList.remove('active'));
    parent.querySelectorAll('.evo-tab').forEach(x => x.style.display = 'none');
    el.classList.add('active');
    document.getElementById(el.dataset.tab).style.display = 'block';
  });
});

// ── Toast ──
function toast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── API helper ──
async function api(method, path, body) {
  const opt = { method, headers: { 'Accept': 'application/json' } };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
}

// ── Format helpers ──
function confidenceBar(c) {
  const pct = Math.round(c * 100);
  const color = c >= 0.8 ? '#00b894' : c >= 0.5 ? '#fdcb6e' : '#d63031';
  return `<span class="cbar"><span class="cbar-fill" style="width:${pct}%;background:${color}"></span></span>${c.toFixed(2)}`;
}

function fmtTime(sec) {
  const d = Math.floor(sec / 86400); const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60); const s = sec % 60;
  let r = ''; if (d) r += d + 'd '; if (h) r += h + 'h '; r += m + 'm ' + s + 's'; return r;
}

// ── Load Overview ──
async function loadOverview() {
  try {
    const [health, stats, evoStats] = await Promise.all([
      api('GET', '/health'), api('GET', '/stats'), api('GET', '/evolution/stats')
    ]);
    const stg = stats.storage || {};
    const idx = stats.index || health;

    document.getElementById('uptime').textContent = fmtTime(stats.uptime_seconds || health.uptime_seconds || 0);
    document.getElementById('idxver').textContent = idx.index_version ?? '-';
    document.getElementById('total-srch').textContent = idx.total_searches ?? 0;
    document.getElementById('cache-rate').textContent = (idx.cache_hit_rate ?? 0) + '%';
    document.getElementById('evo-pending').textContent = evoStats.pending_evolutions ?? 0;
    document.getElementById('evo-fb').textContent = evoStats.total_feedback ?? 0;
    document.getElementById('evo-arch').textContent = evoStats.archived_versions ?? 0;

    document.getElementById('overview-cards').innerHTML = `
      <div class="card green"><div class="label">有效规则</div><div class="value">${stg.active_rules ?? 0}</div><div class="sub">/ ${stg.total_rules ?? 0} 总计</div></div>
      <div class="card blue"><div class="label">分类</div><div class="value">${(stg.categories || []).length}</div><div class="sub">${(stg.categories || []).join(', ')}</div></div>
      <div class="card orange"><div class="label">热缓存</div><div class="value">${idx.hot_cache_size ?? 0}</div><div class="sub">冷区: ${idx.cold_count ?? 0}</div></div>
      <div class="card purple"><div class="label">标签</div><div class="value">${idx.tag_count ?? 0}</div><div class="sub">索引版本 ${idx.index_version ?? 0}</div></div>
      <div class="card" style="grid-column:span 2"><div class="label">分类分布</div><div id="cat-chart"></div></div>
    `;

    // Category chart (simple bars)
    loadCategoryChart(stg);
  } catch (e) { toast('加载概览失败: ' + e.message, 'error'); }
}

async function loadCategoryChart(stg) {
  const cats = stg.categories || [];
  // 获取每个分类的实际规则数
  let counts = {};
  let total = 0;
  for (const c of cats) {
    try {
      const rules = await api('GET', '/rules?category=' + encodeURIComponent(c));
      const n = Array.isArray(rules) ? rules.length : 0;
      counts[c] = n;
      total += n;
    } catch(e) { counts[c] = 0; }
  }
  const colors = ['#0984e3','#00b894','#e17055','#6c5ce7','#fdcb6e','#d63031'];
  const html = cats.map(c => {
    const pct = total > 0 ? (counts[c] / total * 100) : 0;
    const ci = cats.indexOf(c) % colors.length;
    return `<div class="row"><span class="name">${c}</span><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${colors[ci]}"></div><span class="bar-label">${counts[c]} (${Math.round(pct)}%)</span></div></div>`;
  }).join('');
  document.getElementById('cat-chart').innerHTML = `<div class="cat-bar">${html}</div>`;
}

// ── Load Rules ──
async function loadRules(cat) {
  try {
    const catFilter = cat || document.getElementById('rule-cat-filter').value;
    const params = catFilter === 'all' ? '' : '?category=' + encodeURIComponent(catFilter);
    const rules = await api('GET', '/rules' + params);

    const tbody = document.getElementById('rule-table');
    const empty = document.getElementById('rule-empty');
    if (!rules || rules.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    tbody.innerHTML = rules.map(r => `<tr>
      <td style="font-family:monospace">${r.id}</td>
      <td><strong>${esc(r.title)}</strong></td>
      <td><span class="tag">${esc(r.category)}</span></td>
      <td>${confidenceBar(r.confidence || 0)}</td>
      <td>${(r.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td>
      <td>${r.hit_count ?? 0}</td>
      <td><button class="btn btn-outline btn-sm" onclick="toggleDetail(this)">展开</button></td>
    </tr><tr id="detail-${escId(r.id)}" style="display:none"><td colspan="7" style="padding:0">
      <div style="padding:14px;background:#f8f9fa;font-size:13px;white-space:pre-wrap;font-family:monospace">${esc(r.content || '')}</div>
      <div style="padding:0 14px 10px;background:#f8f9fa;font-size:12px;color:#636e72">
        版本: ${r.version || 1} | 置信度: ${r.confidence ?? '-'} | 命中: ${r.hit_count ?? 0} | 创建: ${r.created_at || '-'}
      </div>
    </td></tr>`).join('');
  } catch (e) { toast('加载规则失败: ' + e.message, 'error'); }
}

function toggleDetail(btn) {
  const detailRow = btn.closest('tr').nextElementSibling;
  if (!detailRow || !detailRow.id.startsWith('detail-')) return;
  if (detailRow.style.display === 'none') { detailRow.style.display = 'table-row'; btn.textContent = '收起'; }
  else { detailRow.style.display = 'none'; btn.textContent = '展开'; }
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escId(s) { return 'detail-' + encodeURIComponent(s).replace(/%/g,'_'); }

// ── Search ──
async function doSearch() {
  const q = document.getElementById('sq').value.trim();
  if (!q) return;
  const st = document.getElementById('stype').value;
  const cat = document.getElementById('scat').value;
  const div = document.getElementById('search-results');
  div.innerHTML = '<div class="empty">搜索中…</div>';
  try {
    const res = await api('POST', '/search', { query: q, search_type: st, category: cat });
    const results = res.results || [];
    if (results.length === 0) { div.innerHTML = '<div class="empty">无匹配结果</div>'; return; }
    div.innerHTML = results.map(r => `<div class="result-card">
      <h3>${esc(r.title)} <span class="tag">${esc(r.category)}</span></h3>
      <div class="meta">
        <span>ID: ${esc(r.id)}</span>
        <span>${confidenceBar(r.confidence)}</span>
        <span>命中: ${r.hit_count ?? 0}</span>
        ${(r.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      </div>
      <div class="content show">${esc(r.content)}</div>
      <div style="margin-top:6px">
        <button class="fb" onclick="sendFeedback('${esc(r.id)}',true,this)">&#128077; 有用</button>
        <button class="fb" onclick="sendFeedback('${esc(r.id)}',false,this)">&#128078; 无用</button>
      </div>
    </div>`).join('');
  } catch (e) { div.innerHTML = '<div class="empty">搜索失败: ' + esc(e.message) + '</div>'; }
}

async function sendFeedback(ruleId, satisfied, btn) {
  try {
    await api('POST', '/search', { query: ruleId, search_type: 'exact', user_feedback: satisfied });
    btn.classList.add('done');
    btn.textContent = satisfied ? '&#10003; 已反馈有用' : '&#10003; 已反馈无用';
    toast('反馈已记录', 'success');
  } catch (e) { toast('反馈失败', 'error'); }
}

// ── Evolution ──
async function loadPending() {
  const div = document.getElementById('evo-pending-list');
  try {
    const res = await api('GET', '/evolution/pending');
    const list = res.pending || [];
    if (list.length === 0) { div.innerHTML = '<div class="empty">没有待处理的进化</div>'; return; }
    div.innerHTML = list.map((p, i) => `<div class="evo-item">
      <div class="info"><strong>${esc(p.rule_id)}</strong>
        <div class="desc">${esc(p.evolution_type)} ${p.params && p.params.hint ? '— ' + esc(p.params.hint) : ''}</div></div>
    </div>`).join('');
  } catch (e) { div.innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>'; }
}

async function evoDryRun() {
  const div = document.getElementById('evo-pending-list');
  div.innerHTML = '<div class="empty">预览中…</div>';
  try {
    const res = await api('POST', '/evolve?dry_run=true');
    const changes = res.changes || [];
    if (changes.length === 0) { div.innerHTML = '<div class="empty">无变更</div>'; return; }
    div.innerHTML = changes.map(c => `<div class="evo-item">
      <div class="info"><strong>${esc(c.rule_id)}</strong>
        <div class="desc">${esc(c.evolution_type)} | ${c.old_confidence.toFixed(2)} → ${c.new_confidence.toFixed(2)} | ${esc(c.trigger_reason)}</div></div>
    </div>`).join('');
    toast('预览完成, ' + changes.length + ' 项待处理', 'info');
  } catch (e) { div.innerHTML = '<div class="empty">预览失败: ' + esc(e.message) + '</div>'; }
}

async function evoApply() {
  if (!confirm('确定执行所有待处理进化？')) return;
  const div = document.getElementById('evo-pending-list');
  div.innerHTML = '<div class="empty">执行中…</div>';
  try {
    const res = await api('POST', '/evolve');
    toast('进化完成, ' + (res.applied || 0) + ' 项变更', 'success');
    loadPending();
    loadOverview();
  } catch (e) { div.innerHTML = '<div class="empty">执行失败: ' + esc(e.message) + '</div>'; }
}

// ── Rollback ──
async function loadVersions() {
  const ruleId = document.getElementById('rb-rule-id').value.trim();
  if (!ruleId) { toast('请输入规则 ID', 'error'); return; }
  const dv = document.getElementById('rb-versions');
  try {
    const res = await api('GET', '/evolution/versions/' + encodeURIComponent(ruleId));
    const vers = res.archived_versions || [];
    if (vers.length === 0) { dv.innerHTML = '<div class="empty">无归档版本</div>'; document.getElementById('rb-form').style.display = 'none'; return; }
    dv.innerHTML = '归档版本: ' + vers.map(v => `<span class="tag" style="cursor:pointer" onclick="document.getElementById('rb-version').value=${v}">v${v}</span>`).join(' ');
    document.getElementById('rb-form').style.display = 'flex';
  } catch (e) { dv.innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>'; }
}

async function doRollback() {
  const ruleId = document.getElementById('rb-rule-id').value.trim();
  const ver = parseInt(document.getElementById('rb-version').value);
  if (!ruleId || !ver) { toast('请填写规则 ID 和版本号', 'error'); return; }
  if (!confirm('确定回滚 ' + ruleId + ' 到 v' + ver + '?')) return;
  try {
    const res = await api('POST', '/rollback', { rule_id: ruleId, target_version: ver });
    if (res.success) { toast('回滚成功', 'success'); loadOverview(); }
    else { toast('回滚失败: 版本不存在', 'error'); }
  } catch (e) { toast('回滚失败: ' + e.message, 'error'); }
}

// ── Add Rule ──
function showAddRule() { document.getElementById('add-rule-overlay').style.display = 'block'; }
function hideAddRule(e) { if (!e || e.target === document.getElementById('add-rule-overlay')) document.getElementById('add-rule-overlay').style.display = 'none'; }

async function addRule() {
  const ta = document.getElementById('rule-json');
  const result = document.getElementById('add-rule-result');
  let data;
  try { data = JSON.parse(ta.value); } catch (e) { result.innerHTML = '<span style="color:#d63031">JSON 格式错误</span>'; return; }
  // POST to add - need to use the /search endpoint as a workaround or create a temp file
  // Actually, we need to save it to a file and use the CLI...
  // Let's use a simpler approach: write to temp file and call the CLI
  result.innerHTML = '<span style="color:#636e72">添加中…</span>';
  try {
    const r = await fetch('/add-rule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!r.ok) { const t = await r.text(); throw new Error(t); }
    const j = await r.json();
    if (j.ok) { result.innerHTML = '<span style="color:#00b894">添加成功</span>'; ta.value = ''; loadRules(); }
    else { result.innerHTML = '<span style="color:#d63031">' + esc(j.msg) + '</span>'; }
  } catch (e) { result.innerHTML = '<span style="color:#d63031">' + esc(e.message) + '</span>'; }
}

// ── Category filter popup ──
async function populateCatFilter() {
  try {
    const stats = await api('GET', '/stats');
    const cats = stats.storage.categories || [];
    const sel1 = document.getElementById('rule-cat-filter');
    const sel2 = document.getElementById('scat');
    const opts1 = '<option value="all">全部分类</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    const opts2 = '<option value="all">全部分类</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    sel1.innerHTML = opts1;
    sel2.innerHTML = opts2;
    sel1.addEventListener('change', () => loadRules());
  } catch(e) {}
}

// ── Logs ──
let logPollTimer = null;

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadLogs() {
  const level = document.getElementById('log-level-filter').value;
  const typeFilter = document.getElementById('log-type-filter').value;
  let url = '/logs?limit=100';
  if (level) url += '&level=' + level;
  try {
    const data = await api('GET', url);
    const entries = data.lines || [];
    const div = document.getElementById('log-list');
    if (entries.length === 0) {
      div.innerHTML = '<div class="empty" style="color:#636e72">暂无日志</div>';
      return;
    }
    // Filter by type client-side (since backend doesn't have type param)
    const filtered = typeFilter ? entries.filter(e => (e.log_type || 'system') === typeFilter) : entries;
    if (filtered.length === 0) {
      div.innerHTML = '<div class="empty" style="color:#636e72">无匹配日志</div>';
      return;
    }
    const doScroll = document.getElementById('log-auto-scroll').checked;
    const atBottom = doScroll && (div.scrollTop + div.clientHeight >= div.scrollHeight - 50);
    div.innerHTML = filtered.map(e => {
      const ts = e.timestamp ? e.timestamp.slice(11, 22) : '--:--:--';
      const level = e.level || 'INFO';
      const type = e.log_type || 'system';
      let msg = e.message || '';
      // For query logs, show query details
      const extra = [];
      if (type === 'query' && e.query) {
        msg = '搜索: ' + e.query + (e.search_type ? ' (' + e.search_type + ')' : '');
        if (e.result_count != null) extra.push('结果:' + e.result_count);
        if (e.latency_ms != null) extra.push(e.latency_ms + 'ms');
        if (e.user_feedback != null) extra.push('反馈:' + (e.user_feedback ? '满意' : '不满意'));
      } else if (type === 'evolution') {
        msg = (e.rule_id || '?') + ' → ' + (e.evolution_type || '?');
        if (e.trigger_reason) extra.push(e.trigger_reason);
        if (e.old_confidence != null && e.new_confidence != null) {
          extra.push(e.old_confidence + '→' + e.new_confidence);
        }
      } else if (type === 'system' && e.component) {
        msg = '[' + e.component + '] ' + (e.message || '');
      }
      const extraStr = extra.length ? '<span class="log-extra">' + extra.join(' | ') + '</span>' : '';
      return '<div class="log-entry"><span class="log-time">' + ts + '</span>'
        + '<span class="log-level ' + level + '">' + level + '</span>'
        + '<span class="log-type">' + type + '</span>'
        + '<span class="log-msg">' + escHtml(msg) + extraStr + '</span></div>';
    }).join('');
    if (doScroll) {
      div.scrollTop = div.scrollHeight;
    }
  } catch (e) {
    document.getElementById('log-list').innerHTML = '<div class="empty" style="color:#d63031">加载日志失败: ' + escHtml(e.message) + '</div>';
  }
}

function startLogPolling() {
  if (logPollTimer) clearInterval(logPollTimer);
  loadLogs();
  logPollTimer = setInterval(loadLogs, 3000);
}

function restartLogPolling() {
  if (logPollTimer) clearInterval(logPollTimer);
  startLogPolling();
}

// ── Restart Server ──
async function restartServer() {
  if (!confirm('确定要重启规则系统服务？页面将在服务重启后自动刷新。')) return;
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳ 重启中…';
  try {
    await api('POST', '/restart');
    toast('服务器正在重启，5秒后自动刷新…', 'info');
    // Wait for server to go down, then come back up
    setTimeout(() => {
      let attempts = 0;
      const maxAttempts = 15;
      const poll = setInterval(async () => {
        attempts++;
        try {
          const r = await fetch('/health');
          if (r.ok) {
            clearInterval(poll);
            location.reload();
          }
        } catch(e) {
          // Server still down, keep waiting
        }
        if (attempts >= maxAttempts) {
          clearInterval(poll);
          btn.disabled = false;
          btn.textContent = '↻ 重启服务';
          toast('重启超时，请手动刷新页面', 'error');
        }
      }, 2000);
    }, 3000);
  } catch (e) {
    // Server might have restarted before responding — try to reconnect
    toast('重启触发，等待服务恢复…', 'info');
    setTimeout(() => location.reload(), 3000);
  }
}

// ── Auto Refresh System ──
let autoRefreshEnabled = false;
let autoRefreshTimers = {};
const AUTO_REFRESH_CONFIG = {
  overview: { interval: 10000, loadFn: loadOverview, badgeId: 'ov-badge' },
  rules:    { interval: 30000, loadFn: () => loadRules(), badgeId: 'rules-badge' },
  evolution:{ interval: 15000, loadFn: loadPending, badgeId: 'evo-badge' },
};

function startAutoRefresh() {
  autoRefreshEnabled = true;
  for (const [key, cfg] of Object.entries(AUTO_REFRESH_CONFIG)) {
    if (autoRefreshTimers[key]) clearInterval(autoRefreshTimers[key]);
    autoRefreshTimers[key] = setInterval(() => {
      if (!autoRefreshEnabled) return;
      cfg.loadFn();
    }, cfg.interval);
  }
  document.getElementById('auto-toggle-btn').innerHTML = '&#9633; 暂停';
  document.querySelectorAll('.auto-badge').forEach(el => {
    el.classList.remove('paused');
    el.style.opacity = '1';
  });
}

function stopAutoRefresh() {
  autoRefreshEnabled = false;
  for (const key of Object.keys(autoRefreshTimers)) {
    if (autoRefreshTimers[key]) clearInterval(autoRefreshTimers[key]);
    autoRefreshTimers[key] = null;
  }
  document.getElementById('auto-toggle-btn').innerHTML = '&#9635; 恢复';
  document.querySelectorAll('.auto-badge').forEach(el => {
    el.classList.add('paused');
    el.style.opacity = '0.5';
  });
}

function toggleAutoRefresh() {
  if (autoRefreshEnabled) {
    stopAutoRefresh();
  } else {
    startAutoRefresh();
  }
}

// ── Init ──
(async function init() {
  // Load version for sidebar
  try {
    const h = await api('GET', '/health');
    document.getElementById('sidebar-ver').textContent = 'v2.0 (引擎 ' + (h.version || '1.0.1') + ')';
  } catch(e) {}
  // Apply paused style to badges (auto-refresh off by default)
  document.querySelectorAll('.auto-badge').forEach(el => {
    el.classList.add('paused');
    el.style.opacity = '0.5';
    el.textContent = '● 已暂停';
  });
  await populateCatFilter();
  await loadOverview();
  await loadRules('all');
  await loadPending();
  // Load evolution stats
  try {
    const evo = await api('GET', '/evolution/stats');
    document.getElementById('evo-stats-cards').innerHTML = `
      <div class="card orange"><div class="label">待处理进化</div><div class="value">${evo.pending_evolutions ?? 0}</div></div>
      <div class="card blue"><div class="label">总反馈数</div><div class="value">${evo.total_feedback ?? 0}</div></div>
      <div class="card purple"><div class="label">归档版本数</div><div class="value">${evo.archived_versions ?? 0}</div></div>
    `;
  } catch(e) {}
  // Start log polling
  startLogPolling();
})();
