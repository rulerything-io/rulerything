# Rulerything — 配置文件

server:
  host: "127.0.0.1"
  port: 8001
  workers: 1

index:
  hot_threshold: 3         # hit_count ≥ 此值进入热缓存（v2.0 优化：从 10 降至 3）
  cold_days: 30            # 超过 N 天未访问进入冷区
  rebuild_on_start: true

evolution:
  enabled: true
  auto_apply: true
  min_confidence: 0.3
  batch_size: 10

logging:
  level: "INFO"
  query_log_enabled: true
  metrics_interval_sec: 300

cache:
  # v1.0 缓存配置
  max_size_mb: 512
  # Phase 3: 时间衰减缓存
  enabled: true
  max_size: 5000
  decay_half_life: 3600
  preheat_on_start: true
  preheat_threshold: 1.0

security:
  api_key_required: false
  rate_limit_per_min: 1000

# Phase 1: 熵引擎
entropy:
  enabled: true
  cache_hit_rate_min: 0.6
  avg_latency_max_ms: 20
  conflict_count_max: 100
  low_quality_ratio_max: 0.3
  preheat_accuracy_min: 0.5
  suggestion_cooldown_hours: 24
  max_query_log: 10000

# Phase 2: 规则免疫系统
immune:
  enabled: true
  auto_scan_interval_hours: 24
  auto_cleanup: false
  # 5 维评分权重（可调）
  weight_confidence: 0.3
  weight_timeliness: 0.2
  weight_conflict_free: 0.25
  weight_usefulness: 0.15
  weight_completeness: 0.1

# Phase 3: 集成协调器
adaptive_system:
  enabled: true

# Phase 3 插件：语义搜索（独立，零核心影响）
semantic_search:
  enabled: true
  backend: bm25

# ═══════════════════════════════════════════════════
# v3.0 自适应规则系统配置
# ═══════════════════════════════════════════════════

v3:
  enabled: true
  storage: "sqlite"                # sqlite | jsonl

  # ── 自动依赖挖掘 ──
  dep_miner:
    enabled: true
    schedule_hour: 2               # 每天凌晨 2 点
    cooccurrence_window: 1000      # 共现统计窗口（最近 N 次查询）
    pmi_threshold: 0.3             # PMI 筛选阈值
    content_sim_threshold: 0.7     # 内容相似度视为重复/冲突
    use_scipy: true                # false=纯 Python 降级
    min_queries_for_pmi: 100       # 低于此值仅用内容相似度

  # ── 自动提案系统 ──
  proposal_system:
    enabled: true
    scan_interval_seconds: 30      # 主循环间隔
    cooldown_hours:
      index_rebuild: 24
      cache_tune: 4
      quality_scan: 12
      cold_archive: 168
      dep_refresh: 24
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout_sec: 300

  # ── 知识缺口检测 ──
  gap_detector:
    enabled: true
    schedule_interval_hours: 168   # 每周一次
    similarity_threshold: 0.3
    min_frequency: 5               # 查询频率低于此值忽略
    max_rules_per_week: 15
    use_sklearn: true              # false=纯 Python 降级

  # ── 自动演化 ──
  auto_evolver:
    enabled: true
    require_approval: false        # false=自动执行
    auto_snapshot_before_evolve: true
    max_snapshots: 50
    validation_min_samples: 10     # 统计验证最少样本数
    validation_effect_threshold: 0.5  # Cohen's d 阈值

  # ── AI 桥接层 ──
  ai_bridge:
    enabled: true                  # 启用 AI 增强查询 + 自动提炼
    provider: deepseek             # claude | openai | deepseek | local
    endpoint: ""                    # 留空则使用 provider 默认端点
    api_key_env: "DEEPSEEK_API_KEY"
    model: "deepseek-v4-flash"     # 查询用模型（质量优先）
    ingest_model: "deepseek-v4-flash"  # 提炼用模型（成本优先，留空则复用 model）
    confidence_threshold: 0.6      # 系统检索置信度 ≥ 此值 → 不调 AI
    daily_limit_usd: 1.0           # 每日 AI 预算上限（共享 key，安全阀）
    warn_threshold: 0.8            # 预算使用 80% 时告警
    per_call_limit_usd: 0.1        # 单次调用上限（haiku 调用约 $0.01）
    cache_ttl_hours: 24            # AI 缓存有效期
    cache_max_entries: 5000        # 缓存最大条目数
    max_new_rules_per_session: 10  # 每次 session 最多提炼条数
    max_new_rules_per_day: 50      # 每日最多提炼条数
    temperature: 0.3               # LLM 温度（越低越确定）
    max_tokens: 1024               # LLM 最大输出 token
    title_dedup_threshold: 0.7     # 标题去重相似度阈值
    batch_interval_seconds: 30     # 提炼队列处理间隔

  # ── 超时控制 ──
  timeouts:
    dep_miner: 120
    gap_detector: 60
    auto_evolver: 300
    index_rebuild: 600
    ai_call: 30
