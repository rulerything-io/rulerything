# Rulerything Search Evaluation Cases
#
# This file defines standard queries for evaluating search quality.
# Each query specifies:
#   - id:         Unique identifier
#   - query:      The search query string
#   - category:   Expected rule category
#   - lang:       Language hint (zh/en/ja/...)
#   - expected_rule_ids:  Rules that MUST appear in top results (optional)
#   - relevant_rule_ids:  Rules that SHOULD appear in top results (optional)
#
# New queries should be added without expected_rule_ids initially;
# run evaluate_search.py --update-baseline to capture the first baseline.

